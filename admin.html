<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | نتائج لعبة المفرد والجمع</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec573;
            --warning: #f7b731;
            --danger: #eb3b5a;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #2d3436;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 25px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; background: white; padding: 20px 30px;
            border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header h1 { font-size: 1.8rem; color: var(--primary); }
        .header .status-indicator {
            display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--success);
        }
        .pulse-dot {
            width: 12px; height: 12px; background: var(--success);
            border-radius: 50%; box-shadow: 0 0 0 rgba(46, 204, 113, 0.4);
            animation: pulse 1.5s infinite;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: white; border-radius: 18px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-top: 5px solid var(--primary);
        }
        .stat-card:nth-child(2) { border-color: var(--success); }
        .stat-card:nth-child(3) { border-color: var(--warning); }
        .stat-title { font-size: 1rem; color: #7f8c8d; margin-bottom: 5px; }
        .stat-number { font-size: 2.2rem; font-weight: 800; }

        /* Actions Bar */
        .actions-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }
        .btn-danger {
            background: var(--danger); color: white; border: none;
            padding: 10px 20px; border-radius: 12px; font-family: inherit;
            cursor: pointer; font-weight: 700; transition: 0.2s;
        }
        .btn-danger:hover { opacity: 0.9; }

        /* Table */
        .table-container {
            background: white; border-radius: 20px;
            overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.04);
        }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 18px 25px; border-bottom: 1px solid #edf2f7; }
        th { background: #fdfdfd; color: #4a5568; font-weight: 700; }
        tr:hover { background: #fcfcfc; }
        
        .badge {
            display: inline-block; padding: 6px 14px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 700;
        }
        .badge-perfect { background: #d4edda; color: #155724; }
        .badge-good { background: #fff3cd; color: #856404; }

        .empty-state {
            text-align: center; padding: 50px; color: #a4b0be; font-size: 1.2rem;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 لوحة متابعة نتائج الطلاب</h1>
        <div class="status-indicator">
            <span class="pulse-dot"></span>
            الاتصال مباشر (يتم التحديث لحظياً)
        </div>
    </div>

    <!-- بطاقات الإحصاءات -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">إجمالي المشاركات</div>
            <div class="stat-number" id="totalPlays">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">الحاصلين على علامة كاملة (6/6)</div>
            <div class="stat-number" id="perfectScores" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">مجموع الأخطاء المسجلة</div>
            <div class="stat-number" id="totalMistakes" style="color: var(--warning);">0</div>
        </div>
    </div>

    <div class="actions-bar">
        <h3>قائمة النتائج الأخيرة:</h3>
        <button class="btn-danger" onclick="clearData()">مسح جميع السجلات 🗑️</button>
    </div>

    <!-- جدول النتائج -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>الدرجة</th>
                    <th>النسبة</th>
                    <th>عدد المحاولات الخاطئة</th>
                    <th>التوقيت</th>
                    <th>التقييم</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <!-- النتائج تعبأ هنا تلقائياً -->
            </tbody>
        </table>
        <div class="empty-state" id="emptyState">لا توجد محاولات مسجلة حتى الآن... انتظر حتى يلعب أحد الطلاب!</div>
    </div>

    <script>
        const tableBody = document.getElementById('resultsTableBody');
        const emptyState = document.getElementById('emptyState');
        const channel = new BroadcastChannel('game_results_channel');

        // استقبال التحديثات اللحظية من صفحة اللعبة
        channel.onmessage = (event) => {
            if (event.data.type === 'NEW_RESULT') {
                render();
                // تشغيل تنبيه صوتي خفيف عند وصول نتيجة جديدة
                playNotifySound();
            }
        };

        function getResults() {
            return JSON.parse(localStorage.getItem('game_admin_results') || '[]');
        }

        function render() {
            const results = getResults();
            tableBody.innerHTML = '';

            // تحديث البطاقات
            document.getElementById('totalPlays').innerText = results.length;
            const perfectCount = results.filter(r => r.score === r.total).length;
            document.getElementById('perfectScores').innerText = perfectCount;
            const mistakesCount = results.reduce((acc, curr) => acc + (curr.mistakes || 0), 0);
            document.getElementById('totalMistakes').innerText = mistakesCount;

            if(results.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            results.forEach(res => {
                const tr = document.createElement('tr');
                const percent = Math.round((res.score / res.total) * 100);
                const isPerfect = res.score === res.total;

                tr.innerHTML = `
                    <td style="font-weight: bold; font-size: 1.1rem;">👤 ${res.name}</td>
                    <td><strong>${res.score}</strong> / ${res.total}</td>
                    <td>${percent}%</td>
                    <td>${res.mistakes || 0}</td>
                    <td style="color: #7f8c8d;">${res.date} - ${res.timestamp}</td>
                    <td>
                        <span class="badge ${isPerfect ? 'badge-perfect' : 'badge-good'}">
                            ${isPerfect ? 'ممتاز ⭐⭐⭐' : 'أحسنت 👍'}
                        </span>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function clearData() {
            if(confirm("هل أنت متأكد من مسح جميع سجلات ونتائج الطلاب؟")) {
                localStorage.removeItem('game_admin_results');
                render();
            }
        }

        function playNotifySound() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
        }

        // تشغيل العرض عند فتح الصفحة
        render();
    </script>
</body>
</html>
